dependencies {
    // 내부 모듈
    implementation project(':core-module')
    implementation project(':infrastructure-module')
    implementation project(':external-api')
    // logging-module이 p6spy를 api로 노출하지만, batch는 HTTP 요청이 없어 p6spy를 쓰지 않으므로
    // 전이 의존을 차단해 datasource 자동 데코레이션(SQL 로그 신규 발생)을 막는다.
    implementation(project(':logging-module')) {
        exclude group: 'com.github.gavlyukovskiy', module: 'p6spy-spring-boot-starter'
    }

    // QueryDSL — @QueryProjection Result DTO가 이 모듈로 이관될 때 Q타입 생성에 필요
    // (OpenFeign 포크 — CVE-2024-49203 대응). 조회는 infrastructure-module의 JPAQueryFactory 사용.
    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:6.11:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // Lombok
    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

// QueryDSL 생성 파일을 build 폴더에 생성하도록 설정 (infrastructure-module 설정 복제)
def querydslDir = layout.buildDirectory.dir("generated/sources/annotationProcessor/java/main").get().asFile
def querydslTestDir = layout.buildDirectory.dir("generated/sources/annotationProcessor/java/test").get().asFile

sourceSets {
    main {
        java {
            srcDirs += querydslDir
        }
    }
    test {
        java {
            srcDirs += querydslTestDir
        }
    }
}

tasks.named('compileJava') {
    options.generatedSourceOutputDirectory = file(querydslDir)
}

tasks.named('compileTestJava') {
    options.generatedSourceOutputDirectory = file(querydslTestDir)
}
