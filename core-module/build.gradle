plugins {
    id 'java-library'
    id 'idea'
}

dependencies {
    api 'io.github.openfeign.querydsl:querydsl-core:6.11'
    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:6.11:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'

    // 트랜잭션 경계(@Transactional / @TransactionalEventListener)는 application 계층의 책임.
    // JPA-free 정리 때 spring-boot-starter-data-jpa가 전이로 주던 spring-tx가 함께 빠졌으므로
    // 명시적으로 선언(전이 의존은 spring-beans/spring-core뿐 — JPA/data 미포함).
    api 'org.springframework:spring-tx'
    // ReservationCommandService의 낙관적 락 재시도 판별용 ObjectOptimisticLockingFailureException 제공.
    // 전이 의존은 spring-jdbc/tx/beans/core뿐 — hibernate/JPA 미포함.
    api 'org.springframework:spring-orm'

    // Lombok
    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:deprecation"
}

// QueryDSL 생성 파일을 build 폴더에 생성하도록 설정
def querydslDir = layout.buildDirectory.dir("generated/sources/annotationProcessor/java/main").get().asFile
def querydslTestDir = layout.buildDirectory.dir("generated/sources/annotationProcessor/java/test").get().asFile

sourceSets {
    main {
        java {
            srcDirs += querydslDir
        }
    }
    test {
        java {
            srcDirs += querydslTestDir
        }
    }
}

tasks.named('compileJava') {
    options.generatedSourceOutputDirectory = file(querydslDir)
}

tasks.named('compileTestJava') {
    options.generatedSourceOutputDirectory = file(querydslTestDir)
}

// IntelliJ IDEA 설정: .apt_generated 폴더 대신 build 폴더 사용
idea {
    module {
        generatedSourceDirs += file(querydslDir)
        generatedSourceDirs += file(querydslTestDir)
    }
}

// This module should not have a main method, so disable bootJar task
jar {
    enabled = true
    archiveClassifier = ''
}

bootJar {
    enabled = false
}
