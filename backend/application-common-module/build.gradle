plugins {
    id 'java-library'
    id 'idea'
}

dependencies {
    // 프레임워크-프리 응용 계약 모듈.
    // - 의존은 domain-module 하나뿐: 읽기 포트 시그니처가 참조하는 PageQuery/PageResult 때문이다.
    //   api로 노출해야 포트를 주입하는 api 모듈이 그 타입을 함께 볼 수 있다.
    // - QueryDSL 의존 없음: 이 모듈의 Result record는 @QueryProjection을 달지 않고
    //   infrastructure:persistence의 DAO가 Projections.constructor로 투영한다. querydsl-apt를 붙이면
    //   QueryDSL이 infra 밖으로 새므로 금지된 배선이다.
    // - spring 의존 없음: 루트 build.gradle의 subprojects 블록이 이 모듈을 제외하므로
    //   spring-boot-starter가 주입되지 않는다. 그 결과 `import org.springframework...` 한 줄이
    //   실제 컴파일 에러가 되어, 프레임워크-프리가 리뷰 규율이 아니라 빌드 게이트로 강제된다.
    api project(':domain-module')

    // Test — domain-module과 같은 이유로 spring-boot-starter-test 통째가 아니라 실제로 쓰는 것만 선언한다.
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:deprecation"
}

// 실행 가능한 애플리케이션이 아니므로 일반 jar만 생성한다.
// bootJar 비활성화 설정은 두지 않는다 — 이 모듈은 org.springframework.boot 플러그인을
// 적용하지 않으므로 bootJar 태스크 자체가 존재하지 않는다(설정하면 스크립트 평가 에러).
jar {
    enabled = true
    archiveClassifier = ''
}
