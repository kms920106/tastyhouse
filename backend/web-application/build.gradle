dependencies {
    // 내부 모듈 — application 계층은 domain과 읽기 계약만 안다.
    // infrastructure를 컴파일 클래스패스에 두지 않는 것이 이 모듈 신설의 핵심이다(빌드 그래프가 계층을 강제).
    implementation project(':domain-module')
    // auth/token 서비스가 쓰는 서블릿-프리 타입(JwtTokenProvider·Redis 토큰 저장소) 한정.
    // 서블릿 결합 타입(필터·EntryPoint)은 security-module에 남아 web-api만 의존한다 — applicationMustBeServletFree가 강제.
    implementation project(':security-core')
    // external-api 의존은 챕터 04에서 제거됐다. 소셜 로그인 SPI는 이 모듈의
    // com.tastyhouse.webapplication.auth.port.out 로 옮겨 왔고, 어댑터(external-api)가
    // 그 계약에 의존한다 — 의존 역전. 이 줄을 되살리면 external-api ↔ web-application
    // 순환이 되어 빌드가 깨진다.

    // Spring Boot Starter
    // FileUploadCommandService/UseCase가 MultipartFile을 업로드 경계 파라미터로 받는다.
    // 실사용이 MultipartFile 1종뿐이라 starter-web 전체 대신 spring-web만 선언한다
    // (admin·ceo-application 동형). 챕터 11 이전에는 api-common-module의 전이로 충족되던 것이다.
    implementation 'org.springframework:spring-web'
    // @Transactional 하나뿐이라 spring-tx만 선언한다.
    // Jackson은 참조 0건이다 — 챕터 10으로 Response record가 web-api로 떠나면서
    // 이 모듈의 Jackson 어노테이션 참조가 모두 사라졌다.
    implementation 'org.springframework:spring-tx'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.2.1'
}

// 실행 모듈이 아니므로 bootJar 비활성 (security-module 선례)
jar {
    enabled = true
    archiveClassifier = ''
}

bootJar {
    enabled = false
}
