dependencies {
    // 내부 모듈 — application 계층은 domain과 읽기 계약만 안다.
    // infrastructure를 컴파일 클래스패스에 두지 않는 것이 이 모듈 신설의 핵심이다(빌드 그래프가 계층을 강제).
    implementation project(':domain-module')
    // auth/token 서비스가 쓰는 서블릿-프리 타입(JwtTokenProvider·Redis 토큰 저장소) 한정.
    // 서블릿 결합 타입(필터·EntryPoint)은 security-module에 남아 web-api만 의존한다 — applicationMustBeServletFree가 강제.
    implementation project(':security-core')
    // 소셜 로그인 SPI(com.tastyhouse.external.oauth.spi)·외부 클라이언트 계약.
    // batch-application 선례와 같은 근거 — external-api는 도메인 밖 외부 시스템 접근 계약이라
    // infrastructure와 달리 계층 규칙을 깨지 않는다.
    implementation project(':external-api')
    // Response record·PaginationResponse 등 표현 계약(QueryService가 조립).
    implementation project(':api-common-module')

    // Spring Boot Starter — @Transactional 하나뿐이라 spring-tx만 선언한다.
    // starter-web은 선언하지 않는다: org.springframework.web..·MultipartFile·jakarta.servlet 참조가
    // 모두 0건이다(이전 주석의 "MultipartFile 때문에 필요"는 스테일이었다).
    // Response record가 쓰는 Jackson 어노테이션은 api-common-module이 api로 노출하는
    // starter-web에서 전이로 충족된다.
    implementation 'org.springframework:spring-tx'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.2.1'
}

// 실행 모듈이 아니므로 bootJar 비활성 (security-module 선례)
jar {
    enabled = true
    archiveClassifier = ''
}

bootJar {
    enabled = false
}
