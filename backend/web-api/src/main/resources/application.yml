server:
  port: 8080

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

spring:
  application:
    name: web-api
  config:
    import:
      - classpath:application-logging.yml
      - classpath:application-persistence.yml
      - classpath:application-file-storage.yml
      - classpath:application-oauth.yml
      - classpath:application-pg.yml
      - classpath:application-mail.yml
      - classpath:application-sms.yml
      - classpath:application-redis.yml
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET_WEB}
  accessTokenExpiration: 3600000 # 1시간 (ms)
  refreshTokenExpiration: 604800000 # 7일 (ms) - 일반 로그인
  rememberMeRefreshTokenExpiration: 2592000000 # 30일 (ms) - 로그인 상태 유지
