plugins {
    id 'java-library'
    id 'idea'
}

dependencies {
    implementation project(':domain')

    runtimeOnly project(':infrastructure:tosspayments')
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:deprecation"
}

jar {
    enabled = true
    archiveClassifier = ''
}

bootJar {
    enabled = false
}
