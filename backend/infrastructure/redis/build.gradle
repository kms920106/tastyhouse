plugins {
    id 'java-library'
    id 'idea'
}

dependencies {
    // domain-module에 의존하지 않는다. rate limiting은 domain에 대응 개념이 없는 순수 인프라
    // 관심사라서 RateLimitException도 ErrorCode에 결합하지 않는다(RateLimitException javadoc 참조).
    // HTTP 응답 조립은 각 api 모듈의 GlobalExceptionHandler가 ErrorCode로 직접 수행한다.

    // StringRedisTemplate·RedisConnectionFactory — RedisConfig와 RateLimiterService가 사용한다.
    // 소비 모듈(security-module의 토큰 저장소)의 시그니처에도 RedisTemplate이 노출되므로 api로 둔다.
    api 'org.springframework.boot:spring-boot-starter-data-redis'
    // RateLimitAspect의 @Aspect/@Before
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    // RateLimitAspect가 HttpServletRequest·RequestContextHolder로 클라이언트 IP를 해석한다.
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:deprecation"
}

// 실행 가능한 애플리케이션이 아니므로 bootJar를 비활성화한다(security-module 선례).
jar {
    enabled = true
    archiveClassifier = ''
}

bootJar {
    enabled = false
}
