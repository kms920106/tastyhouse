file:
  aws:
    s3:
      bucket-name: ${S3_BUCKET_NAME}
      region: ap-northeast-2
      base-url: https://cdn.tastyhouse.com

mail:
  aws:
    ses:
      access-key: ${AWS_SES_ACCESS_KEY}
      secret-key: ${AWS_SES_SECRET_KEY}
      region: ap-northeast-2

sms:
