plugins {
    id 'java-library'
    id 'idea'
}

dependencies {
    implementation project(':domain')
    implementation project(':application-core')

    api 'org.springframework.boot:spring-boot-starter-data-jpa'

    implementation('io.github.openfeign.querydsl:querydsl-jpa:6.11') {
        exclude group: 'io.projectreactor', module: 'reactor-core'
    }
    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:6.11:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.2.1'
    testRuntimeOnly 'com.mysql:mysql-connector-j'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

tasks.register('integrationTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    systemProperty 'tastyhouse.schema', rootProject.file('schema.sql').absolutePath
    shouldRunAfter tasks.named('test')
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:deprecation"
}

def querydslDir = layout.buildDirectory.dir("generated/sources/annotationProcessor/java/main").get().asFile
def querydslTestDir = layout.buildDirectory.dir("generated/sources/annotationProcessor/java/test").get().asFile

sourceSets {
    main {
        java {
            srcDirs += querydslDir
        }
    }
    test {
        java {
            srcDirs += querydslTestDir
        }
    }
}

tasks.named('compileJava') {
    options.generatedSourceOutputDirectory = file(querydslDir)
}

tasks.named('compileTestJava') {
    options.generatedSourceOutputDirectory = file(querydslTestDir)
}

idea {
    module {
        generatedSourceDirs += file(querydslDir)
        generatedSourceDirs += file(querydslTestDir)
    }
}

jar {
    enabled = true
    archiveClassifier = ''
}

bootJar {
    enabled = false
}
