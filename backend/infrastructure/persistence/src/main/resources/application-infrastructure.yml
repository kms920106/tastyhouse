spring:
  config:
    import:
      - classpath:application-jpa.yml

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always

persistence:
  banner:
    write:
      provider: ${BANNER_WRITE_PROVIDER:jpa}

logging:
  level:
    p6spy: INFO
