spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:3000} # 3초 (ms)
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:1000} # 1초 (ms)
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000} # 30분 (ms)
      keepalive-time: ${DB_POOL_KEEPALIVE_TIME_MS:60000} # 1분 (ms)
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:0} # 0 = 끔 (ms)
      data-source-properties:
        connectTimeout: ${DB_CONNECT_TIMEOUT_MS:3000} # 3초 (ms)
        socketTimeout: ${DB_SOCKET_TIMEOUT_MS:0} # 0 = 무제한 (ms)
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useLocalSessionState: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        rewriteBatchedStatements: true
        maintainTimeStats: false

  sql:
    init:
      mode: always
