server:
  port: 8080

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

spring:
  application:
    name: web-api
  config:
    import:
      - classpath:application-logging.yml
      - classpath:application-infrastructure.yml
      - classpath:application-external.yml
      - classpath:application-security.yml
      # .env는 작업 디렉터리 기준 상대경로로 해석되므로, 모노레포 루트에서 실행하는 경우와
      # backend/api에서 실행하는 경우를 모두 지원하도록 두 경로를 함께 선언한다.
      - optional:file:.env[.properties]
      - optional:file:backend/api/.env[.properties]
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET_WEB}
  accessTokenExpiration: 3600000 # 1시간 (ms)
  refreshTokenExpiration: 604800000 # 7일 (ms) - 일반 로그인
  rememberMeRefreshTokenExpiration: 2592000000 # 30일 (ms) - 로그인 상태 유지

# 카카오 로그인
kakao:
  client-id: ${KAKAO_CLIENT_ID}
  redirect-uri: ${KAKAO_REDIRECT_URI}

# 네이버 로그인
naver:
  client-id: ${NAVER_CLIENT_ID}
  client-secret: ${NAVER_CLIENT_SECRET}
  redirect-uri: ${NAVER_REDIRECT_URI}

# 페이스북 로그인
facebook:
  app-id: ${FACEBOOK_APP_ID}
  app-secret: ${FACEBOOK_APP_SECRET}

# 애플 로그인
apple:
  team-id: ${APPLE_TEAM_ID}
  client-id: ${APPLE_CLIENT_ID}
  key-id: ${APPLE_KEY_ID}
  redirect-uri: ${APPLE_REDIRECT_URI}
  private-key: ${APPLE_PRIVATE_KEY}
