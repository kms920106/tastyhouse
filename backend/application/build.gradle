plugins {
    id 'java-test-fixtures'
}

dependencies {
    implementation project(':domain')
    implementation project(':security-core')

    implementation 'org.springframework.security:spring-security-core'
    implementation 'org.springframework:spring-web'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.springframework:spring-tx'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.2.1'
    testImplementation project(':web-application')
    testImplementation project(':admin-application')
    testImplementation project(':ceo-application')
    testImplementation project(':batch-application')
    testImplementation project(':api-common-module')

    testFixturesApi 'com.tngtech.archunit:archunit-junit5:1.2.1'
    testFixturesImplementation 'org.springframework.boot:spring-boot-autoconfigure'
    testFixturesImplementation 'org.assertj:assertj-core'
    testFixturesImplementation project(':domain')
    testFixturesImplementation 'ch.qos.logback:logback-classic'
}

jar {
    enabled = true
    archiveClassifier = ''
}

bootJar {
    enabled = false
}
