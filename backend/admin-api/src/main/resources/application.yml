server:
  port: 8090

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3010}

spring:
  application:
    name: admin-api
  config:
    import:
      - classpath:application-logging.yml
      - classpath:application-infrastructure.yml
      - classpath:application-file-storage.yml
      - classpath:application-redis.yml
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET_ADMIN}
  accessTokenExpiration: 3600000 # 1시간 (ms)
  refreshTokenExpiration: 604800000 # 7일 (ms) - 일반 로그인
  rememberMeRefreshTokenExpiration: 2592000000 # 30일 (ms) - 로그인 상태 유지

admin:
  seed:
    username: ${ADMIN_SEED_USERNAME:admin}
    password: ${ADMIN_SEED_PASSWORD:__UNSET__}
    name: ${ADMIN_SEED_NAME:최고관리자}
