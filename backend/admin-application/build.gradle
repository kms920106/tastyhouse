dependencies {
    // 내부 모듈 — application 계층은 domain과 읽기 계약만 안다.
    // infrastructure를 컴파일 클래스패스에 두지 않는 것이 이 모듈 신설의 핵심이다(빌드 그래프가 계층을 강제).
    implementation project(':domain-module')
    // auth 서비스가 쓰는 서블릿-프리 타입(JwtTokenProvider·Redis 토큰 저장소) 한정.
    // 서블릿 결합 타입(필터·EntryPoint·SecurityConfig)은 security-module/admin-api에 남는다 —
    // applicationMustBeServletFree가 강제한다.
    implementation project(':security-core')
    // TODO(챕터 06 최종 절단): 이 의존은 제거 대상이다 — 챕터 06으로 Response·PaginationResponse
    // 조립이 api 모듈로 올라가면서 이 모듈의 com.tastyhouse.apicommon 참조가 0건이 됐고,
    // applicationShouldNotDependOnApiCommon이 사용 자체를 금지한다. 지금 남아 있는 이유는
    // FileUploadCommandService/UseCase가 MultipartFile(spring-web)을 쓰는데 그 전이를 이 모듈로
    // 받고 있기 때문이다 — 절단 시 spring-web을 직접 선언해야 한다
// (선언 형태는 ceo-application/build.gradle:20 선례. 단 그 모듈은 spring-web을
//  api-common-module과 '함께' 선언한 것이고 절단을 수행한 것은 아니다).
    implementation project(':api-common-module')

    // Spring Boot Starter
    // AuthService가 AuthenticationManager·SecurityContextHolder를, AdminCommandService가
    // PasswordEncoder를 쓴다. 서블릿 결합은 ArchUnit이 막는다.
    implementation 'org.springframework.security:spring-security-core'
    implementation 'org.springframework:spring-tx'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.2.1'
}

// 실행 모듈이 아니므로 bootJar 비활성 (security-module 선례)
jar {
    enabled = true
    archiveClassifier = ''
}

bootJar {
    enabled = false
}
