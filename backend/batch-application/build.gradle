dependencies {
    // 내부 모듈 — application 계층은 domain과 읽기 계약만 안다.
    // infrastructure를 컴파일 클래스패스에 두지 않는 것이 이 모듈 신설의 핵심이다(빌드 그래프가 계층을 강제).
    implementation project(':domain-module')
    // 챕터 01 §2 판단: crawling/bbq를 이 모듈로 이동하면서 함께 필요해진 의존이다.
    // BbqService가 driven 클라이언트 BbqApiClient·RemoteImageDownloader를 주입받는데, 이들은
    // 이미 external-api 모듈에 있어 방향(application → external 포트)이 맞다. infrastructure와 달리
    // external-api는 도메인 밖 외부 시스템 접근 계약이므로 계층 규칙을 깨지 않는다.
    implementation project(':external-api')

    // 트랜잭션 경계 선언(@Transactional)만을 위한 최소 의존.
    // 이전에는 infrastructure:persistence의 spring-boot-starter-data-jpa를 타고 전이로 들어오던 것이라
    // 소스 어디에도 선언이 없었다. infra를 클래스패스에서 뺀 결과 이 숨은 의존이 드러났으므로
    // starter 통째가 아니라 실제로 쓰는 spring-tx만 명시한다(버전은 Boot BOM이 고정).
    implementation 'org.springframework:spring-tx'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.2.1'
}

// 실행 모듈이 아니므로 bootJar 비활성 (security-module 선례)
jar {
    enabled = true
    archiveClassifier = ''
}

bootJar {
    enabled = false
}
