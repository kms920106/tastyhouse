plugins {
    id 'java-library'
    id 'idea'
}

dependencies {
    // 내부 모듈 — PaginationResponse가 PageResult<T>를, FileService가 FileUploadService를 사용한다.
    // 이 모듈의 공개 시그니처(PaginationResponse.from)에 domain 타입이 노출되므로 api로 둔다.
    api project(':domain-module')
    // GlobalExceptionHandler가 RateLimitException을 처리한다. 이 예외는 챕터 05 §5b에서
    // security-module → infrastructure:redis로 옮겨졌으므로 의존 대상도 함께 바뀐다.
    implementation project(':infrastructure:redis')

    // Spring Boot Starter — @RestControllerAdvice·MultipartFile 사용.
    // 소비 모듈(admin-api/ceo-api/web-api)도 각자 선언하지만 중복은 무해하다.
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // FileService의 @Transactional 때문에 필요하다. 다른 api 모듈은 infrastructure:persistence이
    // api로 노출하는 spring-boot-starter-data-jpa를 통해 spring-tx를 전이로 받지만, 이 모듈은
    // infrastructure:persistence에 의존하지 않으므로(DB 어댑터가 필요 없다) spring-tx만 직접 선언한다.
    // data-jpa 전체를 끌어오면 쓰지도 않는 JPA·HikariCP가 클래스패스에 올라온다.
    implementation 'org.springframework:spring-tx'

    // Swagger — 공용 응답 record가 @Schema를 갖는다.
    api 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'


    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:deprecation"
}

// 실행 가능한 애플리케이션이 아니므로 bootJar를 비활성화한다(security-module 선례).
jar {
    enabled = true
    archiveClassifier = ''
}

bootJar {
    enabled = false
}
