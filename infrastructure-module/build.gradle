plugins {
    id 'java-library'
    id 'idea'
}

dependencies {
    // 내부 모듈
    api project(':domain-module')

    // Spring Boot Starter
    api 'org.springframework.boot:spring-boot-starter-data-jpa'

    // 외부 라이브러리
    implementation 'com.mysql:mysql-connector-j'

    // QueryDSL (OpenFeign 포크 — CVE-2024-49203 대응, 원 com.querydsl:5.0.0은 패치 없음)
    // implementation으로 강등 — 소비 모듈(web/admin/ceo/batch)에 QueryDSL을 전이 노출하지 않는다.
    // 조회는 이 모듈의 <ctx>/query/ DAO가 캡슐화하며, api 모듈은 DAO와 Result DTO만 주입·import한다.
    implementation 'io.github.openfeign.querydsl:querydsl-jpa:6.11'
    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:6.11:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'


    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:deprecation"
}

// QueryDSL 생성 파일을 build 폴더에 생성하도록 설정
def querydslDir = layout.buildDirectory.dir("generated/sources/annotationProcessor/java/main").get().asFile
def querydslTestDir = layout.buildDirectory.dir("generated/sources/annotationProcessor/java/test").get().asFile

sourceSets {
    main {
        java {
            srcDirs += querydslDir
        }
    }
    test {
        java {
            srcDirs += querydslTestDir
        }
    }
}

tasks.named('compileJava') {
    options.generatedSourceOutputDirectory = file(querydslDir)
}

tasks.named('compileTestJava') {
    options.generatedSourceOutputDirectory = file(querydslTestDir)
}

// IntelliJ IDEA 설정: .apt_generated 폴더 대신 build 폴더 사용
idea {
    module {
        generatedSourceDirs += file(querydslDir)
        generatedSourceDirs += file(querydslTestDir)
    }
}

// This module should not have a main method, so disable bootJar task
jar {
    enabled = true
    archiveClassifier = ''
}

bootJar {
    enabled = false
}
