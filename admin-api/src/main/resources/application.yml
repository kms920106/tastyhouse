server:
  port: 8090

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) [%X{requestId:--}] [%thread] %cyan(%logger{36}) : %msg%n"
  level:
    root: INFO
    # INFO: 메타 정보만 로깅 (운영 환경)
    # DEBUG: Request/Response Body 추가 로깅 (개발 환경)
    #    com.tastyhouse.logging: INFO
    com.tastyhouse.logging: DEBUG

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3010}

spring:
  application:
    name: admin-api
  config:
    import:
      - classpath:application-infrastructure.yml
      - classpath:application-external.yml
      - classpath:application-security.yml
      - optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  # web-api와 반드시 다른 시크릿을 사용한다. 동일 시크릿이면 web 회원 토큰이 admin 인증을 통과하는
  # 권한 상승이 발생하므로 admin 전용 환경변수(JWT_SECRET_ADMIN)로 분리한다.
  secret: ${JWT_SECRET_ADMIN}
  accessTokenExpiration: 3600000 # 1시간 (ms)
  refreshTokenExpiration: 604800000 # 7일 (ms) - 일반 로그인
  rememberMeRefreshTokenExpiration: 2592000000 # 30일 (ms) - 로그인 상태 유지

# 최초 SUPER_ADMIN 시드 (공개 가입이 없으므로 첫 관리자는 부팅 시 주입)
# password 미설정(__UNSET__) 시 신규 시드를 거부한다. 운영/최초 기동 시 ADMIN_SEED_PASSWORD 필수.
admin:
  seed:
    username: ${ADMIN_SEED_USERNAME:admin}
    password: ${ADMIN_SEED_PASSWORD:__UNSET__}
    name: ${ADMIN_SEED_NAME:최고관리자}
