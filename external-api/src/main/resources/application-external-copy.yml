spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

sms:
  provider: solapi # solapi | sns
  sender-number: ${SMS_SENDER_NUMBER}

solapi:
  api-key: ${SOLAPI_API_KEY}
  api-secret: ${SOLAPI_API_SECRET}
  sender-number: ${SMS_SENDER_NUMBER}
  base-url: https://api.solapi.com
  send-many-path: /messages/v4/send-many/detail

email:
  provider: javamail # ses | javamail
  sender-address: ${EMAIL_SENDER_ADDRESS}

bbq:
  api:
    base-url: https://bbq.co.kr

payment:
  toss:
    secret-key: ${TOSS_SECRET_KEY}
    base-url: https://api.tosspayments.com
    confirm-path: /v1/payments/confirm

aws:
  sns:
    access-key: ${AWS_SNS_ACCESS_KEY}
    secret-key: ${AWS_SNS_SECRET_KEY}
    region: ap-northeast-2
  ses:
    access-key: ${AWS_SES_ACCESS_KEY}
    secret-key: ${AWS_SES_SECRET_KEY}
    region: ap-northeast-2
